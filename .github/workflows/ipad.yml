name: iPad app
on:
  workflow_dispatch:
  push:
    paths: ['ipad/**', '.github/workflows/ipad.yml']
  pull_request:
    paths: ['ipad/**', '.github/workflows/ipad.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Test protocol and PID core
        run: swift test --package-path ipad/OBDCore
      - name: Build iPad simulator app
        run: xcodebuild -project ipad/OBD2Dash.xcodeproj -scheme OBD2Dash -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
      - name: Build unsigned iPad device app
        run: |
          xcodebuild -project ipad/OBD2Dash.xcodeproj \
            -scheme OBD2Dash -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build/ipad \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" build
      - name: Verify and package IPA
        shell: bash
        run: |
          set -euxo pipefail
          APP=build/ipad/Build/Products/Release-iphoneos/OBD2Dash.app
          test -f "$APP/OBD2Dash"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleSupportedPlatforms:0' "$APP/Info.plist" | grep -qx iPhoneOS
          xcrun lipo "$APP/OBD2Dash" -verify_arch arm64
          mkdir -p build/package/Payload build/artifacts
          ditto "$APP" build/package/Payload/OBD2Dash.app
          (cd build/package && zip -qr ../artifacts/OBD2Dash-unsigned.ipa Payload)
          unzip -t build/artifacts/OBD2Dash-unsigned.ipa
          (cd build/artifacts && shasum -a 256 OBD2Dash-unsigned.ipa > SHA256SUMS.txt)
          echo '### iPad download' >> "$GITHUB_STEP_SUMMARY"
          echo 'Download OBD2Dash-iPad-unsigned from Artifacts below and extract the ZIP. Install the IPA using Sideloadly on Windows with your own Apple account. Requires iPadOS 17+. This unsigned device build needs local signing; it is not a TestFlight build. See ipad/README.md for instructions.' >> "$GITHUB_STEP_SUMMARY"
      - name: Upload iPad app
        uses: actions/upload-artifact@v4
        with:
          name: OBD2Dash-iPad-unsigned
          path: build/artifacts/
          if-no-files-found: error
          retention-days: 30
